# lab.sh butler: the main profile ("Sol") hands coding to the "claude" bot on the kanban board, and
# asks the person before each command that could change something (ask_before_writes.py).
model:
  default: alpha
  provider: custom:my-local
custom_providers:
  - name: My Local
    base_url: http://127.0.0.1:18801/v1
    api_key: sk-stub
    model: alpha
    api_mode: chat_completions
    models:
      alpha: {}
      beta: {}
approvals:
  mode: manual
# The kanban tools are off by default: on for the Dashboard's sessions (cli) and the Hermes API's.
platform_toolsets:
  cli: [hermes-cli, kanban]
  api_server: [hermes-api-server, kanban]
kanban:
  dispatch_interval_seconds: 3
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: "terminal|write_file|patch|execute_code"
      command: "@LAB@/ask_before_writes.py"
      timeout: 20
dashboard:
  public_url: http://redde-lab.test:19119
