model:
  default: alpha
  provider: custom:my-local
custom_providers:
  - name: My Local
    base_url: http://127.0.0.1:18801/v1
    api_key: sk-stub
    model: alpha
    api_mode: chat_completions
    models:
      alpha: {}
      beta: {}
# Ask a person every time: the default hands the question to a model first.
approvals:
  mode: manual
# The Redde push plugin (companion/hermes-plugin/redde-push), which lab.sh copies in.
plugins:
  enabled: [redde-push]
# A public address makes the Dashboard ask for a login, as it does anywhere but loopback: the app
# pairs with the plugin over a Dashboard it is signed in to (lab.sh sets the user and password).
dashboard:
  public_url: http://redde-lab.test:19119
