# Asks each pull request's contributors to sign CLA.md once; signatures live on the
# cla-signatures branch. pull_request_target runs in this repo's context (not the fork's)
# and never checks out the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/goosehouse-llc/redde/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/goosehouse-llc/redde/blob/main/CLA.md)
            and sign it by replying with the sentence below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
