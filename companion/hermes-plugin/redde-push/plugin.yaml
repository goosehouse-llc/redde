name: redde-push
version: 1.17.0
description: "Notifications on your iPhone from Redde when the agent finishes a reply, waits for you (an approval, a question, a password) or gives up on a turn, and when a bot speaks or waits for you in a group chat, encrypted between this Hermes and the phone. And phone tools: with them turned on in Redde, the agent can use the iPhone's calendar, reminders, contacts, photos and a folder of files, set alarms and timers there, write on a widget, and start a call or a message for you to send, through the app. And calls: an agent you allow in Redde can ring your iPhone, like a phone call, when something shouldn't wait. And cards: a map, places, the weather and the time, products to buy (each checked against its store's own page: the price now, in stock or not, its picture, and dead links taken off), the home's devices, reminders, comparisons, game scores, recipes, packages on their way, flights, films and series, conversions and share prices, drawn in Redde under the agent's reply. And email: with an account added in Redde, the person's inbox sorted and kept tidy, every email sent only after they approve it; the weather and the time zone of a place are looked up from Open-Meteo (open-meteo.com), so the agent answers from real numbers."
author: "Goosehouse"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_approval_request
  - post_llm_call
  - pre_api_request
  - post_api_request
  - post_tool_call
  - api_request_error
  - on_session_end
  - subagent_stop
  - agent_loop_stopped
  - pre_tool_call
provides_tools:
  - phone_info
  - phone_calendar_events
  - phone_calendar_add_event
  - phone_reminders_list
  - phone_reminders_add
  - phone_reminders_complete
  - phone_contacts_search
  - phone_photos_search
  - phone_photos_get
