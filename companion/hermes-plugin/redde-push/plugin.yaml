name: redde-push
version: 1.0.0
description: "Notifications on your iPhone from Redde when the agent finishes a reply or waits for an approval, encrypted between this Hermes and the phone."
author: "Goosehouse"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_approval_request
  - post_llm_call
