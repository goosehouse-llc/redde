name: redde-push
version: 1.9.0
description: "Notifications on your iPhone from Redde when the agent finishes a reply, waits for you (an approval, a question, a password) or gives up on a turn, and when a bot speaks or waits for you in a group chat, encrypted between this Hermes and the phone. And phone tools: with them turned on in Redde, the agent can use the iPhone's calendar, reminders, contacts, photos and a folder of files, set alarms and timers there, write on a widget, and start a call or a message for you to send, through the app. And calls: an agent you allow in Redde can ring your iPhone, like a phone call, when something shouldn't wait. And cards: a map, places, the weather and the time, drawn in Redde under the agent's reply; the weather and the time zone of a place are looked up from Open-Meteo (open-meteo.com), so the agent answers from real numbers."
author: "Goosehouse"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_approval_request
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_end
  - subagent_stop
  - agent_loop_stopped
provides_tools:
  - phone_info
  - phone_calendar_events
  - phone_calendar_add_event
  - phone_reminders_list
  - phone_reminders_add
  - phone_reminders_complete
  - phone_contacts_search
  - phone_photos_search
  - phone_photos_get
  - phone_photos_delete
  - phone_files_list
  - phone_files_read
  - phone_files_write
  - phone_files_delete
  - phone_alarms_set
  - phone_alarms_list
  - phone_alarms_cancel
  - phone_widget_set
  - phone_widget_clear
  - phone_people_call
  - phone_people_message
  - call_user
  - redde_show
  - suggest_to_user
  - follow_up_later
  - heads_up_before
