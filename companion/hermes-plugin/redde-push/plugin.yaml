name: redde-push
version: 1.1.0
description: "Notifications on your iPhone from Redde when the agent finishes a reply, waits for you (an approval, a question, a password) or gives up on a turn, encrypted between this Hermes and the phone."
author: "Goosehouse"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_approval_request
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - on_session_end
  - subagent_stop
  - agent_loop_stopped
