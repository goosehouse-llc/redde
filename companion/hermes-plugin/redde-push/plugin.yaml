name: redde-push
version: 1.25.2
description: "Notifications on your iPhone from Redde when the agent finishes a reply, waits for you (an approval, a question, a password) or gives up on a turn, and when a bot speaks or waits for you in a group chat, encrypted between this Hermes and the phone. And phone tools: with them turned on in Redde, the agent can use the iPhone's calendar, reminders, contacts, photos and a folder of files, set alarms and timers there, write on a widget, and start a call or a message for you to send, through the app. And with Keep a copy turned on, the iPhone hands this Hermes a read-only copy of the calendar and reminders while Redde is open, so those two answer even with the app closed, saying when the copy was last synced. And calls: an agent you allow in Redde can ring your iPhone, like a phone call, when something shouldn't wait. And cards: a map, places, the weather and the time, products to buy (each checked against its store's own page: the price now, in stock or not, its picture, and dead links taken off), the home's devices, reminders, comparisons, game scores, recipes, packages on their way, flights, films and series, conversions and share prices, drawn in Redde under the agent's reply. And lists: to-do lists, groceries and the like, kept here and shown in Redde, each on its own tile, to add to and check off from the phone or in any chat. And email: with an account added in Redde, the person's inbox sorted and kept tidy, every email sent only after they approve it; the weather and the time zone of a place are looked up from Open-Meteo (open-meteo.com), so the agent answers from real numbers. And workstreams: over the Dashboard or the Hermes API, the main agent or a bot can hand a job to a chat of its own that works on it by itself, up to three at once, and hears back when it is done or waits for you."
author: "Goosehouse"
provides_hooks:
  - on_session_start
  - pre_llm_call
